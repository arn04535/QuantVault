[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "QuantVault"
version = "0.1.1"
description = "Local quant-research operating system: ledger, analytics, validation, CLI, and dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "arn04535" }]
keywords = [
  "quant",
  "backtest",
  "experiment-tracking",
  "research",
  "reproducibility",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
export = ["pyarrow>=14"]

[project.scripts]
quant-vault = "quantvault.cli:main"
quantvault = "quantvault.cli:main"

[project.urls]
Homepage = "https://github.com/arn04535/QuantVault"
Repository = "https://github.com/arn04535/QuantVault"
Issues = "https://github.com/arn04535/QuantVault/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
