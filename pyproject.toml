[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "QuantLedger"
version = "0.1.0"
description = "Local experiment ledger for quantitative research management"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "arn04535" }]
keywords = [
  "quant",
  "backtest",
  "experiment-tracking",
  "research",
  "reproducibility",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
quantledger = "quantledger.cli:main"

[project.urls]
Homepage = "https://github.com/arn04535/quantledger"
Repository = "https://github.com/arn04535/quantledger"
Issues = "https://github.com/arn04535/quantledger/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
